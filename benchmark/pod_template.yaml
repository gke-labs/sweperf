apiVersion: v1
kind: Pod
metadata:
  name: {{NAME}}
  labels:
    app: swebench
spec:
  restartPolicy: Never
  containers:
  - name: swebench
    image: {{IMAGE}}
    env:
    - name: LLM_LATENCY_MU
      value: "-5"
    - name: LLM_LATENCY_SIGMA
      value: "0.1"
    volumeMounts:
    - name: replay-script-vol
      mountPath: /replay.py
      subPath: replay.py
  volumes:
  - name: replay-script-vol
    configMap:
      name: replay-script
